<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beginner To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>My To-Do List</h1>

      <form id="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="What do you want to do?"
          maxlength="100"
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>

      <p id="empty-message" class="empty-message">No tasks yet.</p>
      <ul id="todo-list" aria-live="polite"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
